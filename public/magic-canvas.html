<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f0c">
<meta name="description" content="Magic Canvas: draw flowers and constellations with your hands">
<title>Magic Canvas</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b0f0c;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  /* Keep the camera on its own compositor layer. Drawing it into the effects
     canvas every frame makes the preview shimmer whenever detection is busy. */
  video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;transform:scaleX(-1);background:#0b0f0c;opacity:0;pointer-events:none;z-index:0;transition:opacity .25s ease}
  body.camera-live video{opacity:1}
  #cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;z-index:1;cursor:crosshair}
  #mirrorHost{position:fixed;inset:0;z-index:4;background:#1a0405;display:none}
  #mirrorHost.open{display:block}
  #mirrorFrame{display:block;width:100%;height:100%;border:0}
  body.mirror-mode{background:
    repeating-linear-gradient(0deg,rgba(35,0,0,.38) 0 2px,transparent 2px 70px),
    repeating-linear-gradient(90deg,rgba(35,0,0,.34) 0 2px,transparent 2px 70px),
    radial-gradient(ellipse at 50% 35%,#b3201c 0,#7a0f12 58%,#3a0508 100%)}
  body.mirror-mode #v,body.mirror-mode #cv,body.mirror-mode #status,body.mirror-mode #hint,body.mirror-mode #toggle,body.mirror-mode #shutter,body.mirror-mode #clear,body.mirror-mode #rec,body.mirror-mode #toast,body.mirror-mode #flash{display:none}
  body.mirror-mode #modes{z-index:25}
  .glass{background:rgba(90,90,90,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  #modes{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px 8px;border:1px solid rgba(255,255,255,.28);border-radius:999px;z-index:5;background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(150,150,160,.28));box-shadow:0 10px 28px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.42);backdrop-filter:blur(24px) saturate(1.25);-webkit-backdrop-filter:blur(24px) saturate(1.25);cursor:default;touch-action:none;user-select:none}
  body.mirror-mode #modes{cursor:grab}
  #modes.dragging{cursor:grabbing}
  .mode{width:48px;height:48px;border-radius:50%;border:2px solid transparent;background:rgba(255,255,255,.04);display:grid;place-items:center;cursor:pointer;opacity:.7;transition:transform .25s,opacity .25s,background .25s,box-shadow .25s;padding:0}
  .mode svg{width:27px;height:27px}.mode span{font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:25px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .mode:hover{opacity:1;transform:translateY(-2px)}
  .mode.active{opacity:1;border-color:#f2a6c0;background:rgba(255,255,255,.18);box-shadow:0 0 0 3px rgba(242,166,192,.16),0 0 24px rgba(233,163,184,.52)}
  #status{position:fixed;top:96px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;font-size:13px;z-index:5;opacity:0;transition:opacity .4s;max-width:90vw;text-align:center;pointer-events:none}
  #hint{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);padding:12px 22px;border-radius:999px;font-size:15px;letter-spacing:.2px;white-space:nowrap;z-index:5}
  #toggle{position:fixed;left:50%;bottom:126px;transform:translateX(-50%);display:flex;padding:5px;border-radius:999px;z-index:5}
  #toggle button{border:0;background:transparent;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:1.5px;font-size:13px;padding:10px 20px;border-radius:999px;cursor:pointer;transition:.25s}
  #toggle button.on{background:#f4a6bd;color:#2b1620}
  #shutter{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;border:4px solid #f3eee8;background:transparent;padding:7px;cursor:pointer;z-index:5}
  #shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#f3eee8;transition:.2s}
  #shutter:active i{transform:scale(.88)}
  #shutter.rec i{background:#ff4d5e;border-radius:18px;transform:scale(.55)}
  #rec{position:fixed;top:30px;right:26px;display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;z-index:5;font-variant-numeric:tabular-nums;font-size:14px}
  #rec b{width:10px;height:10px;border-radius:50%;background:#ff4d5e;animation:bl 1s infinite}
  @keyframes bl{50%{opacity:.2}}
  #clear{position:fixed;right:26px;bottom:40px;width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;z-index:5;padding:0;transition:transform .15s}
  #clear:active{transform:scale(.9)}
  #clear svg{width:28px;height:28px}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
  #toast{position:fixed;left:50%;top:140px;transform:translate(-50%,-10px);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:6;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #start{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#16221a,#0b0f0c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  #start h1{margin:0;font-size:34px;font-weight:600;letter-spacing:.5px}
  #start p{margin:0;color:rgba(255,255,255,.65);max-width:360px;line-height:1.5}
  .btn{border:0;border-radius:999px;background:#f4a6bd;color:#2b1620;font-weight:700;font-size:16px;padding:14px 34px;cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.12);color:#fff;font-size:14px;padding:10px 22px;display:none}
  #err{color:#ff8b97;min-height:20px;font-size:14px;max-width:360px}
  @media(max-width:560px){#hint{font-size:12.5px;padding:10px 14px;white-space:normal;width:86vw;text-align:center}}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="cv"></canvas>

<div id="modes" class="glass">
  <button class="mode active" data-m="flower" aria-label="Flowers">
    <span aria-hidden="true">🌼</span>
  </button>
  <button class="mode" data-m="star" aria-label="Constellations">
    <span aria-hidden="true">⭐</span>
  </button>
  <button class="mode" data-m="mirror" aria-label="Lipstick mirror">
    <span aria-hidden="true" style="font-size:29px;line-height:1">💄</span>
  </button>
</div>

<div id="mirrorHost" aria-label="Lipstick mirror">
  <iframe id="mirrorFrame" title="Lipstick mirror" allow="camera *; microphone *; fullscreen" src="about:blank"></iframe>
</div>

<div id="status" class="glass"></div>
<div id="hint" class="glass">Point to draw · Swipe, shake, rub, or push your open hand to wipe</div>
<div id="toggle" class="glass"><button id="bPhoto" class="on">PHOTO</button><button id="bVideo">VIDEO</button></div>
<button id="shutter" aria-label="Capture"><i></i></button>
<button id="clear" class="glass" aria-label="Wipe away (C)" title="Wipe away (C)"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 11h16a3.5 3.5 0 1 0-3.5-3.5"/><path d="M4 17h22a3.5 3.5 0 1 1-3.5 3.5"/><path d="M4 23h10"/></svg></button>
<div id="rec" class="glass"><b></b><span id="recT">0:00</span></div>
<div id="toast" class="glass"></div>
<div id="flash"></div>

<div id="start">
  <h1>Magic Canvas</h1>
  <p>Point your index finger to draw. Swipe, shake, rub, or push your open hand to wipe everything away. Allow the camera to begin.</p>
  <button id="go" class="btn">Start camera</button>
  <div id="err"></div>
  <button id="skip" class="btn ghost">Continue without camera (mouse / touch)</button>
</div>
<script>
(() => {
const $ = s => document.querySelector(s);
const video=$('#v'), cv=$('#cv'), ctx=cv.getContext('2d',{alpha:true,desynchronized:true});
const mirrorHost=$('#mirrorHost'), mirrorFrame=$('#mirrorFrame');
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=0,H=0,DPR=1,vig=null;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  vig=document.createElement('canvas'); vig.width=W; vig.height=H;
  const g=vig.getContext('2d'), gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.6);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.4)'); g.fillStyle=gr; g.fillRect(0,0,W,H);
}
addEventListener('resize',resize); resize();

/* ================= sprites ================= */
function mk(fn,size=128){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');g.translate(size/2,size/2);fn(g);return c;}
const HSL=[[350,78,52],[25,92,62],[48,100,58],[275,62,58],[225,75,60],[325,80,70],[0,0,98],[190,80,62],[12,88,60],[265,70,72],[340,70,80]];
const hsl=(c,dl=0,a=1)=>`hsla(${c[0]},${c[1]}%,${clamp(c[2]+dl,0,100)}%,${a})`;
function petal(g,len,wid,c){
  g.beginPath(); g.moveTo(0,0);
  g.bezierCurveTo(wid,-len*.3,wid*.8,-len,0,-len);
  g.bezierCurveTo(-wid*.8,-len,-wid,-len*.3,0,0);
  const gr=g.createLinearGradient(0,0,0,-len); gr.addColorStop(0,hsl(c,-14)); gr.addColorStop(1,hsl(c,9));
  g.fillStyle=gr; g.fill(); g.strokeStyle=hsl(c,-22,.35); g.lineWidth=1; g.stroke();
}
function disc(g,r,c1,c2){const gr=g.createRadialGradient(-r*.3,-r*.3,1,0,0,r);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.beginPath();g.arc(0,0,r,0,7);g.fillStyle=gr;g.fill();}
function flowerSprite(){
  const c=pick(HSL), kind=pick(['daisy','daisy','aster','round','round','lily','bell','bell']);
  return mk(g=>{
    g.shadowColor='rgba(0,0,0,.2)'; g.shadowBlur=4; g.shadowOffsetY=1.5;
    if(kind==='daisy'){const n=rnd(8,14)|0;for(let i=0;i<n;i++){g.save();g.rotate(i/n*6.283);petal(g,54,rnd(9,13),c);g.restore();}g.shadowColor='transparent';disc(g,rnd(8,11),'#ffe27a',hsl([35,95,48]));}
    else if(kind==='aster'){for(let k=0;k<2;k++){const n=rnd(20,28)|0;for(let i=0;i<n;i++){g.save();g.rotate(i/n*6.283+k*.12);petal(g,52-k*10,4.5,c);g.restore();}}g.shadowColor='transparent';disc(g,9,hsl([30,90,50]),hsl([20,70,28]));}
    else if(kind==='round'){for(let k=0;k<3;k++){for(let i=0;i<5;i++){g.save();g.rotate(i/5*6.283+k*.6);petal(g,48-k*13,30-k*7,c);g.restore();}}g.shadowColor='transparent';disc(g,5,hsl(c,-18),hsl(c,-30));}
    else if(kind==='lily'){for(let i=0;i<6;i++){g.save();g.rotate(i/6*6.283);petal(g,60,8.5,c);g.strokeStyle=hsl(c,-28,.5);g.beginPath();g.moveTo(0,-4);g.lineTo(0,-40);g.stroke();g.restore();}
      g.shadowColor='transparent';g.strokeStyle='#7a4a2a';g.lineWidth=1.4;for(let i=0;i<6;i++){g.save();g.rotate(i/6*6.283+.3);g.beginPath();g.moveTo(0,0);g.lineTo(0,-20);g.stroke();g.fillStyle='#d9822b';g.beginPath();g.arc(0,-21,2.4,0,7);g.fill();g.restore();}}
    else {for(let i=0;i<5;i++){g.save();g.rotate(i/5*6.283);petal(g,46,26,c);g.restore();}g.shadowColor='transparent';disc(g,9,'#fff',hsl(c,22));disc(g,3.5,'#ffd35e','#e3a21d');}
  });
}
function leafSprite(){
  const gc=[rnd(95,140),rnd(38,58),rnd(30,42)];
  return mk(g=>{
    g.shadowColor='rgba(0,0,0,.2)'; g.shadowBlur=3; g.translate(0,30); petal(g,62,19,gc); g.shadowColor='transparent';
    g.strokeStyle=hsl(gc,-22,.7); g.lineWidth=1.3; g.beginPath(); g.moveTo(0,0); g.lineTo(0,-56); g.stroke();
    for(let i=1;i<5;i++){g.beginPath();g.moveTo(0,-i*11);g.lineTo(9,-i*11-8);g.moveTo(0,-i*11);g.lineTo(-9,-i*11-8);g.stroke();}
  });
}
function petalSprite(){const c=pick(HSL);return mk(g=>{g.translate(0,26);petal(g,52,20,c);},64);}
function starSprite(){
  const col=pick(['#fff3c4','#ffe28a','#cfe6ff','#ffffff','#ffd6f0']), pts=pick([4,4,5]);
  return mk(g=>{
    g.shadowColor=col; g.shadowBlur=18; g.beginPath();
    const R=40,r=pts===4?7:17;
    for(let i=0;i<pts*2;i++){const a=i/(pts*2)*6.283-1.5708,rad=i%2?r:R;g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);}
    g.closePath(); g.fillStyle=col; g.fill(); g.fill();
  });
}
const ballSprite=mk(g=>{
  const gr=g.createRadialGradient(-16,-18,2,0,0,52);gr.addColorStop(0,'#fffbd8');gr.addColorStop(.2,'#9ff8eb');gr.addColorStop(.62,'#6f91ed');gr.addColorStop(1,'#33245f');
  g.shadowColor='rgba(101,235,255,.75)';g.shadowBlur=18;g.beginPath();g.arc(0,0,45,0,7);g.fillStyle=gr;g.fill();g.shadowColor='transparent';
  g.lineWidth=2.2;g.strokeStyle='rgba(224,255,255,.72)';g.beginPath();g.arc(0,0,45,0,7);g.stroke();
  g.strokeStyle='rgba(185,255,242,.65)';g.lineWidth=3;g.beginPath();g.ellipse(0,5,42,15,-.18,0,7);g.stroke();
  g.strokeStyle='rgba(232,206,255,.7)';g.lineWidth=2;g.beginPath();g.ellipse(0,-8,35,11,.22,0,7);g.stroke();
  g.fillStyle='#fff';g.beginPath();g.arc(-16,-19,7,0,7);g.fill();g.globalAlpha=.55;g.beginPath();g.arc(19,17,3,0,7);g.fill();g.globalAlpha=1;
});
function glowSprite(r,g_,b){return mk(g=>{const gr=g.createRadialGradient(0,0,0,0,0,32);gr.addColorStop(0,`rgba(${r},${g_},${b},1)`);gr.addColorStop(.3,`rgba(${r},${g_},${b},.45)`);gr.addColorStop(1,`rgba(${r},${g_},${b},0)`);g.fillStyle=gr;g.fillRect(-32,-32,64,64);},64);}
const flowers=Array.from({length:44},flowerSprite), leaves=Array.from({length:10},leafSprite),
      petals=Array.from({length:16},petalSprite), stars=Array.from({length:10},starSprite);
const GLOW={flower:[glowSprite(255,190,215),glowSprite(255,238,170),glowSprite(255,255,255)],
            star:[glowSprite(255,246,200),glowSprite(200,225,255),glowSprite(190,255,255)], ball:[glowSprite(125,240,255),glowSprite(210,185,255),glowSprite(255,255,220)]};
const WINDLIFT={flower:-90,star:-260,ball:220};
/* ================= state ================= */
let mode='flower';
const HINTS={flower:'Point to draw · Swipe, shake, rub, or push your open hand to wipe',star:'Draw a constellation · Swipe, shake, rub, or push to clear',ball:'Create aurora orbs · Swipe, shake, rub, or push to clear'};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
  if(modesDrag.moved){modesDrag.moved=false;return;}
  mode=b.dataset.m; document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));
  if(mode==='mirror'){
    document.body.classList.add('mirror-mode');
    mirrorHost.classList.add('open');
    if(mirrorFrame.getAttribute('src')==='about:blank') mirrorFrame.src='/lipstick-mirror.html';
    return;
  }
  document.body.classList.remove('mirror-mode');
  mirrorHost.classList.remove('open');
  // Reloading the child releases its camera stream before returning to the canvas.
  mirrorFrame.src='about:blank';
  modes.style.left='50%';modes.style.top='20px';modes.style.transform='translateX(-50%)';
  $('#hint').textContent=HINTS[mode];
});
const modes=$('#modes');
const modesDrag={active:false,moved:false,pointerId:null,dx:0,dy:0};
modes.addEventListener('pointerdown',event=>{
  if(!document.body.classList.contains('mirror-mode'))return;
  // Mode buttons must remain ordinary clickable controls; drag from the pill's glass area.
  if(event.target.closest('.mode')){modesDrag.moved=false;return;}
  if(event.button!==undefined&&event.button!==0)return;
  const rect=modes.getBoundingClientRect();
  modesDrag.active=true;modesDrag.moved=false;modesDrag.pointerId=event.pointerId;
  modesDrag.dx=event.clientX-rect.left;modesDrag.dy=event.clientY-rect.top;
  modes.setPointerCapture?.(event.pointerId);modes.classList.add('dragging');
});
modes.addEventListener('pointermove',event=>{
  if(!document.body.classList.contains('mirror-mode')||!modesDrag.active||event.pointerId!==modesDrag.pointerId)return;
  const rect=modes.getBoundingClientRect();
  if(!modesDrag.moved&&Math.hypot(event.clientX-(rect.left+modesDrag.dx),event.clientY-(rect.top+modesDrag.dy))<4)return;
  modesDrag.moved=true;
  const maxX=Math.max(0,innerWidth-rect.width),maxY=Math.max(0,innerHeight-rect.height);
  const x=clamp(event.clientX-modesDrag.dx,0,maxX),y=clamp(event.clientY-modesDrag.dy,0,maxY);
  modes.style.left=`${x}px`;modes.style.top=`${y}px`;modes.style.transform='none';
});
const stopModesDrag=event=>{
  if(!modesDrag.active||event.pointerId!==modesDrag.pointerId)return;
  modesDrag.active=false;modes.classList.remove('dragging');modes.releasePointerCapture?.(event.pointerId);
};
modes.addEventListener('pointerup',stopModesDrag);modes.addEventListener('pointercancel',stopModesDrag);
const strokes=[], P=[], HS={};
const ptr={down:false,x:0,y:0};
const amb=Array.from({length:18},()=>({x:Math.random(),y:Math.random(),vx:rnd(-.01,.012),vy:rnd(-.02,-.004),r:rnd(8,20),ph:rnd(0,6.28)}));

/* ================= One-Euro filter (smooth but responsive) ================= */
const alpha=(te,fc)=>1/(1+(1/(2*Math.PI*fc))/te);
class OneEuro{
  constructor(mc,b,dc){this.mc=mc;this.b=b;this.dc=dc;this.x=null;this.dx=0;this.t=0;}
  reset(){this.x=null;this.dx=0;}
  f(v,t){
    if(this.x===null){this.x=v;this.t=t;this.dx=0;return v;}
    const te=Math.max(.001,(t-this.t)/1000);this.t=t;
    this.dx+=alpha(te,this.dc)*((v-this.x)/te-this.dx);
    this.x+=alpha(te,this.mc+this.b*Math.abs(this.dx))*(v-this.x);
    return this.x;
  }
}

/* ================= drawing helpers ================= */
function spark(x,y,vx,vy,life,size,m,delay=0){
  if(P.length>650)return;
  P.push({k:'spark',x,y,vx,vy,life,s:size,sp:pick(GLOW[m]),born:performance.now()+delay*1000,ph:rnd(0,6.28)});
}
function newStroke(m){return {mode:m,items:[],pts:[],released:false,relAt:0,wind:1};}
function addItem(stroke,x,y,ang){
  const m=stroke.mode; let it;
  if(m==='flower'){
    if(Math.random()<.24){const side=Math.random()<.5?1:-1;it={leaf:true,sp:pick(leaves),s:rnd(26,46),rot:ang+Math.PI/2+side*rnd(.6,1.3)};}
    else it={sp:pick(flowers),s:Math.random()<.25?rnd(54,76):rnd(28,56),rot:rnd(-3.14,3.14)};
  } else if(m==='star') it={sp:pick(stars),s:Math.random()<.2?rnd(30,42):rnd(12,28),rot:rnd(-.4,.4)};
  else it={sp:ballSprite,s:rnd(36,50),rot:rnd(-.5,.5)};
  Object.assign(it,{x,y,born:performance.now(),ph:rnd(0,6.28),blowStart:0,fl:false,fade:1,sc:1,vx:0,vy:0,vr:0});
  stroke.items.push(it);
  const burst=m==='star'?3:2;
  for(let i=0;i<burst;i++)spark(x,y,rnd(-40,40),rnd(-50,10),rnd(.5,.9),rnd(14,24),m);
}
function drawTo(st,stroke,x,y){
  const gap={flower:19,star:24,ball:64}[stroke.mode];
  const lp=stroke.pts[stroke.pts.length-1];
  if(!lp||Math.hypot(x-lp.x,y-lp.y)>2.5)stroke.pts.push({x,y});
  if(st.lx==null){addItem(stroke,x,y,0);st.lx=x;st.ly=y;return;}
  const dx=x-st.lx,dy=y-st.ly,d=Math.hypot(dx,dy);
  if(d<gap)return;
  const n=Math.min(14,Math.floor(d/gap)),ux=dx/d,uy=dy/d,ang=Math.atan2(dy,dx);
  let px=st.lx,py=st.ly;
  for(let k=0;k<n;k++){px+=ux*gap;py+=uy*gap;addItem(stroke,px+rnd(-3,3),py+rnd(-3,3),ang);}
  st.lx=px;st.ly=py;
}

/* wipe: a wave front sweeps from the palm, each flower is hit when the front reaches it */
const FRONT=2600;
function release(stroke,wind,now,fx){
  if(stroke.released||!stroke.items.length){stroke.released=true;return;}
  stroke.released=true;stroke.wind=wind;stroke.relAt=now;
  stroke.items.forEach(it=>{
    const ahead=Math.max(0,(it.x-fx)*wind);
    it.blowStart=now+30+ahead/FRONT*1000+rnd(0,70);
  });
}

    baseOptions:{modelAssetPath:MODEL,delegate},runningMode:'VIDEO',numHands:2,

  recordCtx.globalAlpha=1;recordCtx.globalCompositeOperation='source-over';
  recordCtx.clearRect(0,0,W,H);
  if(video.videoWidth&&video.srcObject){
    recordCtx.save();recordCtx.translate(W,0);recordCtx.scale(-1,1);
    recordCtx.drawImage(video,vT.ox,vT.oy,vT.dw,vT.dh);recordCtx.restore();
  }
  recordCtx.drawImage(cv,0,0,W,H);
}
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
$('#bPhoto').onclick=()=>{if(recorder)return;capMode='photo';$('#bPhoto').classList.add('on');$('#bVideo').classList.remove('on');};
$('#bVideo').onclick=()=>{if(recorder)return;capMode='video';$('#bVideo').classList.add('on');$('#bPhoto').classList.remove('on');};
$('#shutter').onclick=()=>{
  if(capMode==='photo'){
    const f=$('#flash');f.style.transition='none';f.style.opacity=.85;requestAnimationFrame(()=>{f.style.transition='opacity .4s';f.style.opacity=0;});
    recordCanvas=document.createElement('canvas');composeOutput();
    recordCanvas.toBlob(b=>{download(b,`magical-wands-${Date.now()}.png`);toast('Photo saved');recordCanvas=null;recordCtx=null;},'image/png');
  } else if(!recorder){
    const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
    if(!mt){toast('Video recording not supported');return;}
    recordCanvas=document.createElement('canvas');composeOutput();
    chunks=[];recorder=new MediaRecorder(recordCanvas.captureStream(30),{mimeType:mt,videoBitsPerSecond:12e6});
    recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    recorder.onstop=()=>{download(new Blob(chunks,{type:mt}),`magical-wands-${Date.now()}.${mt.includes('mp4')?'mp4':'webm'}`);toast('Video saved');recordCanvas=null;recordCtx=null;};
    recorder.start(250);recStart=Date.now();$('#shutter').classList.add('rec');$('#rec').style.display='flex';
    recTimer=setInterval(()=>{const s=((Date.now()-recStart)/1000)|0;$('#recT').textContent=`${(s/60)|0}:${String(s%60).padStart(2,'0')}`;},250);
  } else {
    recorder.stop();recorder=null;clearInterval(recTimer);$('#shutter').classList.remove('rec');$('#rec').style.display='none';
  }
};

/* ================= start ================= */
$('#go').onclick=async()=>{
  $('#err').textContent='';
  try{
    if(cameraStream) cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30},resizeMode:'none'},audio:false});
    video.srcObject=cameraStream;await video.play();
    document.body.classList.add('camera-live');
    $('#start').style.display='none';initTracker();
  }catch(e){
    $('#err').textContent='Camera unavailable: '+(e.message||e.name)+' (needs https or localhost, and camera permission).';
    $('#skip').style.display='inline-block';
  }
};
$('#skip').onclick=()=>{$('#start').style.display='none';trackState='failed';setStatus('No camera — draw with mouse / touch');setTimeout(()=>setStatus(''),3000);};
function releaseCamera(){
  if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;}
  if(video.srcObject) video.srcObject=null;
  document.body.classList.remove('camera-live');
}
addEventListener('pagehide',releaseCamera);
addEventListener('beforeunload',releaseCamera);
requestAnimationFrame(frame);
})();
</script>
